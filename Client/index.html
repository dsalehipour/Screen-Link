<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Browser zoom is disabled because pinching is forwarded to the view transform instead. Letting
     the page zoom too would fight the canvas transform and break coordinate mapping. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>screenlink</title>
<!-- Saved to an Android home screen this opens without browser chrome, which is both nicer and one
     less thing eating the viewport. The icons are drawn by the server at whatever size is asked
     for; see AppIcon.swift. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#14181d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --border: #232a32;
    --text: #e6edf3;
    --muted: #7d8896;
    --accent: #3fb950;
    --danger: #f85149;
    --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    /* On a phone 100vh is the height with the browser chrome retracted, so while the URL bar is on
       screen the last stretch of the layout sits below the fold. overflow:hidden then makes it
       unreachable. dvh tracks the height actually available; vh stays as the fallback. */
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    /* Above the canvas whatever the zoom. Without this the scaled canvas paints over the bar and
       there is no way to turn control back off once it is on. */
    position: relative;
    z-index: 2;
  }
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger); display: inline-block; margin-right: 7px;
    transition: background 0.2s;
  }
  .dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .spacer { flex: 1; }
  .stats { display: flex; gap: 18px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .stats b { color: var(--text); font-weight: 600; }
  button {
    background: #1f262e; color: var(--text); border: 1px solid var(--border);
    padding: 5px 11px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #2a323b; }
  button.on { background: var(--accent); border-color: var(--accent); color: #04260c; font-weight: 600; }
  button.on:hover { background: #48c65a; }
  select {
    background: #1f262e; color: var(--text); border: 1px solid var(--border);
    padding: 5px 9px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
    max-width: 260px;
  }
  select:hover { background: #2a323b; }
  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 16px; min-height: 0; position: relative;
    /* Clips the zoomed canvas to the viewing area instead of letting it spill over the bar. */
    overflow: hidden;
  }
  canvas {
    max-width: 100%; max-height: 100%;
    border-radius: 8px; border: 1px solid var(--border);
    background: #000; display: block; cursor: default;
    /* Gestures are interpreted here, so the browser must not claim them for pan and zoom. */
    touch-action: none;
    /* Scaling from the top-left keeps the zoom-about-a-point arithmetic simple. */
    transform-origin: 0 0;
  }
  canvas.controlling { cursor: crosshair; }
  /* The soft keyboard only appears for a focused, editable element, so there has to be one. It is
     positioned rather than hidden because display:none and visibility:hidden are not focusable. */
  #keyboard-sink {
    position: absolute; opacity: 0; pointer-events: none;
    width: 1px; height: 1px; bottom: 0; left: 0; border: 0;
  }
  .touch-only { display: none; }
  @media (pointer: coarse) {
    .touch-only { display: inline-block; }
    .stats { display: none; }
    /* Wrapping rather than overflowing: a control pushed off the edge of a phone cannot be
       reached at all, and one of them is how control gets turned back off. */
    header { gap: 6px; padding: 7px 10px; flex-wrap: wrap; }
    .spacer { display: none; }
    .brand-name { display: none; }
    select, button { max-width: 33vw; padding: 6px 9px; }
  }
  #overlay {
    position: absolute; inset: 16px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; pointer-events: none; text-align: center;
    /* The pairing code is shown here on its own line. */
    white-space: pre-line;
  }
  #overlay.hidden { display: none; }
  /* Transient confirmation for gestures that change a mode, which otherwise give no sign of having
     registered. Above the canvas, so zoom cannot bury it. */
  #toast {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: rgba(20,24,29,0.94); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 20px; color: var(--text); font-size: 12px;
    pointer-events: none; opacity: 0; transition: opacity 0.25s; z-index: 3;
  }
  #toast.show { opacity: 1; }
  /* Diagnostics for input that only misbehaves on a real phone. Reached by tapping the status dot
     three times, because a phone cannot be attached to a debugger the way a desktop can. */
  #debug {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 45%; overflow-y: auto;
    background: rgba(10,12,15,0.94); border-top: 1px solid var(--border); z-index: 4;
    font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #9fe8a0; padding: 8px 10px; white-space: pre-wrap; word-break: break-all;
  }
  #debug.hidden { display: none; }
  #debug b { color: #6ea8fe; }
</style>
</head>
<body>
<header>
  <span class="brand"><span class="dot" id="dot"></span><span class="brand-name">screenlink</span></span>
  <select id="display" title="Which display to stream"></select>
  <select id="quality" title="Stream resolution"></select>
  <button id="control">Enable control</button>
  <button id="keyboard" class="touch-only">Keyboard</button>
  <button id="zoomreset" class="touch-only">Fit</button>
  <button id="fullscreen">Fullscreen</button>
  <div class="spacer"></div>
  <div class="stats">
    <span>latency <b id="lat">—</b></span>
    <span>fps <b id="fps">—</b></span>
    <span>bitrate <b id="rate">—</b></span>
    <span id="res">—</span>
  </div>
</header>
<main>
  <canvas id="screen"></canvas>
  <input id="keyboard-sink" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div id="overlay">connecting…</div>
  <div id="toast"></div>
  <div id="debug" class="hidden"></div>
</main>

<script>
// The token arrives in the fragment, which browsers never send to a server. It stays out of
// request lines, access logs and the Referer header; the page is served without it and reads it
// here. The query string is still accepted so older links keep working.
const TOKEN = new URLSearchParams(location.hash.slice(1)).get('t')
  ?? new URLSearchParams(location.search).get('token')
  ?? '';

// What this device presents on later visits. Approval happens once, at the Mac; from then on the
// credential below is what opens a session, and revoking it there ends this device's access.
const DEVICE_KEY = 'screenlink.device';

function loadDevice() {
  try {
    return JSON.parse(localStorage.getItem(DEVICE_KEY)) ?? {};
  } catch (_) {
    return {};
  }
}

function saveDevice(device) {
  try {
    localStorage.setItem(DEVICE_KEY, JSON.stringify(device));
  } catch (_) {
    // Private browsing refuses storage. Pairing still works, it just repeats next visit.
  }
}

/// A label for the approval prompt on the Mac, so the person deciding knows what is asking.
function deviceLabel() {
  const ua = navigator.userAgent;
  const platform = /Android/.test(ua) ? 'Android'
    : /iPhone|iPad/.test(ua) ? 'iOS'
    : /Mac OS X/.test(ua) ? 'Mac'
    : /Windows/.test(ua) ? 'Windows'
    : 'device';
  const browser = /EdgA?\//.test(ua) ? 'Edge'
    : /Chrome\//.test(ua) ? 'Chrome'
    : /Firefox\//.test(ua) ? 'Firefox'
    : /Safari\//.test(ua) ? 'Safari'
    : 'browser';
  return `${browser} on ${platform}`;
}

// Same origin as this page: the server serves HTTP and WebSocket on one port, so anything that can
// reach the page can reach the socket, through tunnels and reverse proxies included.
const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
const dot = document.getElementById('dot');
const overlay = document.getElementById('overlay');
const toast = document.getElementById('toast');
const controlBtn = document.getElementById('control');

let toastTimer = null;
function flash(text) {
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
}

// A phone's keyboard cannot be watched from a desktop debugger, and it behaves differently from
// every emulation of it, so it has to be able to describe itself. Three taps on the status dot.
const CLIENT_BUILD = '2026-08-02a';
const debugPanel = document.getElementById('debug');
const debugLines = [];
let debugOn = false;

function debugLog(line) {
  if (!debugOn) return;
  debugLines.push(line);
  if (debugLines.length > 40) debugLines.shift();
  debugPanel.textContent = debugLines.join('\n');
  debugPanel.scrollTop = debugPanel.scrollHeight;
}

let dotTaps = [];
document.getElementById('dot').addEventListener('click', () => {
  const now = Date.now();
  dotTaps = dotTaps.filter((t) => now - t < 900);
  dotTaps.push(now);
  if (dotTaps.length < 3) return;
  dotTaps = [];
  debugOn = !debugOn;
  debugPanel.classList.toggle('hidden', !debugOn);
  debugLines.length = 0;
  debugPanel.textContent = '';
  if (debugOn) debugLog(`build ${CLIENT_BUILD} — ${navigator.userAgent}`);
});

let ws = null;
let decoder = null;
let controlling = false;
let awaitingApproval = false;
let denied = false;
let sawKeyframe = false;
let chunkTimestamp = 0;

const stats = { frames: 0, bytes: 0, latencySum: 0, latencyCount: 0 };

// Overlay text and the connection dot are independent: frames arriving should clear the overlay
// without touching connection state, and a drop should show the dot without hiding the video.
function setOverlay(text) {
  if (text === null) { overlay.classList.add('hidden'); return; }
  overlay.textContent = text;
  overlay.classList.remove('hidden');
}

function setConnected(live) {
  dot.classList.toggle('live', live);
}

// ---- decode ----------------------------------------------------------------

function initDecoder(codec) {
  if (decoder) { try { decoder.close(); } catch (_) {} }
  sawKeyframe = false;
  decoder = new VideoDecoder({
    output: (frame) => {
      if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
        canvas.width = frame.displayWidth;
        canvas.height = frame.displayHeight;
      }
      // Drawing straight from the output callback rather than waiting for rAF avoids
      // adding a display refresh interval to the end-to-end latency.
      ctx.drawImage(frame, 0, 0);
      frame.close();
      setOverlay(null);
    },
    error: (e) => {
      console.error('decoder', e);
      // Recover by asking for a fresh IDR rather than tearing the socket down.
      sawKeyframe = false;
      send({ type: 'keyframe' });
    },
  });
  decoder.configure({
    codec,
    optimizeForLatency: true,
    hardwareAcceleration: 'prefer-hardware',
  });
  // A fresh decoder cannot use anything before the next IDR, so ask for one rather than waiting
  // out the keyframe interval.
  send({ type: 'keyframe' });
}

// ---- displays ---------------------------------------------------------------

let currentCodec = null;
let currentDims = null;
let currentDisplayID = null;
let currentMaxWidth = 0;

// A phone has room for the name of a thing or its dimensions, not both. Spelling everything out
// wraps the bar onto a third row, which costs more screen than the detail is worth.
const compact = matchMedia('(pointer: coarse)').matches;

function applyInfo(msg) {
  document.getElementById('res').textContent = `${msg.width}×${msg.height}`;
  populateDisplays(msg.displays, msg.displayID);
  populateQuality(msg.displays.find((d) => d.id === msg.displayID), msg.maxWidth);
  settled(msg);
  currentDisplayID = msg.displayID;
  currentMaxWidth = msg.maxWidth ?? 0;

  // The server sends info twice around a display switch: once with the new resolution, then again
  // once the new SPS reveals the real codec. Only rebuild the decoder when something actually moved.
  const dims = `${msg.width}x${msg.height}`;
  if (msg.codec !== currentCodec || dims !== currentDims) {
    currentCodec = msg.codec;
    currentDims = dims;
    initDecoder(msg.codec);
  }
}

function populateDisplays(list, activeID) {
  const select = document.getElementById('display');
  if (!list || list.length === 0) { select.style.display = 'none'; return; }

  const signature = list.map((d) => `${d.id}:${d.width}x${d.height}`).join(',');
  if (select.dataset.signature !== signature) {
    select.textContent = '';
    for (const d of list) {
      const option = document.createElement('option');
      option.value = d.id;
      option.textContent = compact
        ? d.name
        : `${d.name} — ${d.width}×${d.height}${d.isMain ? ' (main)' : ''}`;
      select.appendChild(option);
    }
    select.dataset.signature = signature;
  }
  select.value = String(activeID);
  select.style.display = list.length > 1 ? '' : 'none';
}

// ---- resolution -------------------------------------------------------------

// Fewer pixels means less to encode, send and decode, so the default is well under what the panel
// can do. That is the right trade for pointing and clicking and the wrong one for reading, hence
// the choice. The step above the panel's own width is pointless, so the list stops there.
const QUALITY_STEPS = [
  { width: 1280, label: 'Fast' },
  { width: 1920, label: 'Balanced' },
  { width: 2560, label: 'Sharp' },
  { width: 0, label: 'Full resolution' },
];

function populateQuality(display, activeWidth) {
  const select = document.getElementById('quality');
  if (!display) { select.style.display = 'none'; return; }

  const native = display.nativeWidth;
  const steps = QUALITY_STEPS.filter((s) => s.width === 0 || s.width < native);
  const signature = `${native}:${steps.map((s) => s.width).join(',')}`;
  if (select.dataset.signature !== signature) {
    select.textContent = '';
    for (const step of steps) {
      const option = document.createElement('option');
      option.value = String(step.width);
      const px = step.width === 0 ? native : step.width;
      option.textContent = compact ? step.label : `${step.label} — ${px}px`;
      select.appendChild(option);
    }
    select.dataset.signature = signature;
  }
  // A width the server reports but this list does not offer still has to show as selected.
  const wanted = String(activeWidth ?? 0);
  select.value = [...select.options].some((o) => o.value === wanted) ? wanted : '0';
  select.style.display = steps.length > 1 ? '' : 'none';
}

// ---- change confirmation ----------------------------------------------------

// A request the Mac ignores used to look exactly like one it honoured: the picker moved and the
// picture did not. Every change now states what it expects back and says so if that never lands.
let awaiting = null;

function expect(description, matches, revert) {
  clearTimeout(awaiting?.timer);
  awaiting = {
    matches,
    revert,
    timer: setTimeout(() => {
      const pending = awaiting;
      awaiting = null;
      setOverlay(null);
      pending?.revert();
      flash(`${description} did not take effect`);
    }, 5000),
  };
}

function settled(info) {
  if (!awaiting || !awaiting.matches(info)) return;
  clearTimeout(awaiting.timer);
  awaiting = null;
}

document.getElementById('display').addEventListener('change', (e) => {
  const wanted = Number(e.target.value);
  const previous = currentDisplayID;
  setOverlay('switching display…');
  send({ type: 'display', display: wanted });
  expect('display switch',
    (info) => info.displayID === wanted,
    () => { document.getElementById('display').value = String(previous); });
});

document.getElementById('quality').addEventListener('change', (e) => {
  const wanted = Number(e.target.value);
  const previous = currentMaxWidth;
  setOverlay('changing resolution…');
  send({ type: 'quality', maxWidth: wanted });
  expect('resolution change',
    (info) => (info.maxWidth ?? 0) === wanted,
    () => { document.getElementById('quality').value = String(previous); });
});

function onVideo(buffer) {
  const view = new DataView(buffer);
  const isKey = view.getUint8(1) === 1;
  const captureMs = view.getFloat64(4, true);
  const payload = new Uint8Array(buffer, 12);

  stats.frames++;
  stats.bytes += payload.byteLength;
  // Server and browser share a wall clock here, so this is a true capture-to-decode figure.
  stats.latencySum += Date.now() - captureMs;
  stats.latencyCount++;

  if (!decoder || decoder.state !== 'configured') return;
  // WebCodecs rejects a delta frame as the first chunk after configure().
  if (!sawKeyframe) {
    if (!isKey) return;
    sawKeyframe = true;
  }
  chunkTimestamp += 1000;
  try {
    decoder.decode(new EncodedVideoChunk({
      type: isKey ? 'key' : 'delta',
      timestamp: chunkTimestamp,
      data: payload,
    }));
  } catch (e) {
    console.error('decode', e);
    sawKeyframe = false;
  }
}

// ---- transport -------------------------------------------------------------

function connect() {
  setOverlay('connecting…');
  setConnected(false);
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    const device = loadDevice();
    send({
      type: 'auth',
      token: TOKEN,
      deviceId: device.id,
      deviceSecret: device.secret,
      deviceName: deviceLabel(),
    });
    setConnected(true);
    setOverlay('connecting…');
  };
  ws.onmessage = (event) => {
    if (typeof event.data === 'string') {
      const msg = JSON.parse(event.data);
      switch (msg.type) {
        case 'info':
          setOverlay('waiting for first frame…');
          applyInfo(msg);
          break;
        case 'status':
          setOverlay(msg.message);
          break;
        case 'pairing':
          // Holding the link only got us this far. Someone at the Mac has to agree, and the code
          // is shown on both screens so they are approving this device and not somebody else's.
          awaitingApproval = true;
          setOverlay(`Approve on your Mac to continue.\n\nCode ${msg.code}`);
          break;
        case 'paired':
          awaitingApproval = false;
          saveDevice({ id: msg.deviceId, secret: msg.deviceSecret });
          // The link has done its job. Drop it from the address bar so a bookmark, a screenshot or
          // a shared URL no longer carries it.
          history.replaceState(null, '', location.pathname);
          setOverlay('approved — starting…');
          break;
        case 'denied':
          awaitingApproval = false;
          denied = true;
          setOverlay('This Mac refused the request.');
          break;
      }
      return;
    }
    onVideo(event.data);
  };
  ws.onclose = () => {
    setConnected(false);
    if (denied) return;  // Reconnecting would only ask again and pester whoever said no.
    setOverlay(awaitingApproval ? 'Approval timed out — retrying…' : 'disconnected — retrying…');
    awaitingApproval = false;
    setTimeout(connect, 1000);
  };
  ws.onerror = () => ws.close();
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ---- input -----------------------------------------------------------------

// Coordinates go out normalized to [0,1] over the captured display. The canvas is letterboxed
// and scaled by CSS, so the bounding rect is the only correct reference for the mapping.
function normalized(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: Math.min(Math.max((event.clientX - rect.left) / rect.width, 0), 1),
    y: Math.min(Math.max((event.clientY - rect.top) / rect.height, 0), 1),
  };
}

function modifiers(event) {
  return { meta: event.metaKey, shift: event.shiftKey, alt: event.altKey, ctrl: event.ctrlKey };
}

const BUTTONS = ['left', 'middle', 'right'];

let pendingMove = null;
function flushMove() {
  if (pendingMove) { send(pendingMove); pendingMove = null; }
  requestAnimationFrame(flushMove);
}
requestAnimationFrame(flushMove);

canvas.addEventListener('mousemove', (e) => {
  if (!controlling) return;
  // Coalesced to one move per frame; the OS cannot consume them faster and queueing adds lag.
  pendingMove = { type: 'mouse', action: 'move', ...normalized(e), ...modifiers(e) };
});

canvas.addEventListener('mousedown', (e) => {
  if (!controlling) return;
  e.preventDefault();
  send({ type: 'mouse', action: 'down', button: BUTTONS[e.button] || 'left', ...normalized(e), ...modifiers(e) });
});

window.addEventListener('mouseup', (e) => {
  if (!controlling) return;
  send({ type: 'mouse', action: 'up', button: BUTTONS[e.button] || 'left', ...normalized(e), ...modifiers(e) });
});

canvas.addEventListener('contextmenu', (e) => { if (controlling) e.preventDefault(); });

canvas.addEventListener('wheel', (e) => {
  if (!controlling) return;
  e.preventDefault();
  send({ type: 'scroll', dx: e.deltaX, dy: e.deltaY, ...normalized(e), ...modifiers(e) });
}, { passive: false });

// ---- view transform --------------------------------------------------------

// A phone screen is a fraction of the size of the Mac's, so the view needs its own zoom and pan
// that are entirely local: nothing here is sent to the Mac. Because the transform is CSS,
// getBoundingClientRect already reports the transformed box, so normalized() keeps working and
// taps land on the right pixel at any zoom level.
const view = { scale: 1, x: 0, y: 0 };
const MAX_SCALE = 8;
const zoomResetBtn = document.getElementById('zoomreset');

function setControlling(enabled) {
  controlling = enabled;
  controlBtn.classList.toggle('on', controlling);
  controlBtn.textContent = controlling ? 'Control enabled' : 'Enable control';
  canvas.classList.toggle('controlling', controlling);
  // A keyboard over a read-only view types into nothing, so it leaves with control rather than
  // sitting over half the picture waiting for keys that will be dropped.
  if (!controlling && document.activeElement === keyboardSink) keyboardSink.blur();
}

// Three quick taps turn control on, so it can be reached without aiming at the bar. Only while
// read-only: once control is on, taps are clicks, and holding every one back long enough to rule
// out a third would put a visible delay on the thing that most needs to feel immediate. Turning it
// off is the button, which is why the bar sits above the picture at any zoom.
const TRIPLE_TAP_WINDOW = 500;
let recentTaps = [];

function countReadOnlyTap() {
  const now = Date.now();
  recentTaps = recentTaps.filter((t) => now - t < TRIPLE_TAP_WINDOW);
  recentTaps.push(now);
  if (recentTaps.length < 3) return;
  recentTaps = [];
  setControlling(true);
  flash('control enabled');
}

let lastTapAt = 0;
let lastTapPoint = { x: 0, y: 0 };

function writeTransform() {
  canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
}

/**
 * How far the image has to shift along one axis to sit legally: centred when it is smaller than the
 * viewport, and covering it with no gap at either edge when it is larger.
 */
function correction(start, size, stageStart, stageSize) {
  if (size <= stageSize) return stageStart + (stageSize - size) / 2 - start;
  if (start > stageStart) return stageStart - start;
  const end = start + size;
  const stageEnd = stageStart + stageSize;
  if (end < stageEnd) return stageEnd - end;
  return 0;
}

/**
 * Writes the transform, then measures the result and corrects it.
 *
 * Deriving the bounds arithmetically instead meant reading offsetWidth and offsetTop, which are
 * rounded to whole pixels and are defined relative to the offset parent rather than to the box the
 * image actually has to stay inside. Both errors get multiplied by the zoom factor. Measuring the
 * boxes that are really on screen sidesteps the question entirely.
 */
function applyView() {
  view.scale = Math.min(Math.max(view.scale, 1), MAX_SCALE);
  writeTransform();

  const stage = canvas.parentElement.getBoundingClientRect();
  const rect = canvas.getBoundingClientRect();
  const dx = correction(rect.left, rect.width, stage.left, stage.width);
  const dy = correction(rect.top, rect.height, stage.top, stage.height);
  if (dx || dy) {
    view.x += dx;
    view.y += dy;
    writeTransform();
  }

  zoomResetBtn.textContent = view.scale > 1.01 ? `${Math.round(view.scale * 100)}%` : 'Fit';
}

function zoomAbout(clientX, clientY, factor) {
  const previous = view.scale;
  view.scale = Math.min(Math.max(view.scale * factor, 1), MAX_SCALE);
  const ratio = view.scale / previous;
  if (ratio === 1) return;

  // Measured against the canvas itself rather than the stage: the canvas is centred by flexbox, so
  // its own box already carries that offset, which anchoring against the stage would drop. With
  // transform-origin at 0 0, a point sitting d away from the canvas origin lands at d * ratio, so
  // translating back by the difference holds it under the fingers.
  const rect = canvas.getBoundingClientRect();
  view.x -= (clientX - rect.left) * (ratio - 1);
  view.y -= (clientY - rect.top) * (ratio - 1);
  applyView();
}

function resetView() {
  view.scale = 1; view.x = 0; view.y = 0;
  applyView();
}

// ---- touch -----------------------------------------------------------------

// Finger count decides intent, which is what makes the whole thing predictable: one finger acts on
// the Mac, two move the view, three scroll. Handled with touch events rather than pointer events
// because the count is the discriminator and preventDefault stops the browser from synthesizing a
// duplicate round of mouse events.
//
// The mode is chosen when the gesture starts and held until every finger lifts. Without that,
// releasing one finger from a pinch would momentarily look like a one-finger drag and click on
// whatever happened to be underneath.
const TAP_SLOP = 10;
const PRESS_DELAY = 140;
const LONG_PRESS = 550;
const DOUBLE_TAP_WINDOW = 300;

let gesture = null;

function pinchState(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return {
    distance: Math.hypot(dx, dy) || 1,
    x: (touches[0].clientX + touches[1].clientX) / 2,
    y: (touches[0].clientY + touches[1].clientY) / 2,
  };
}

function centroid(touches) {
  let x = 0, y = 0;
  for (const touch of touches) { x += touch.clientX; y += touch.clientY; }
  return { x: x / touches.length, y: y / touches.length };
}

function releasePress(at) {
  if (!gesture?.pressed) return;
  send({ type: 'mouse', action: 'up', button: 'left', ...at });
  gesture.pressed = false;
}

/**
 * Moves the pointer and presses, in that order.
 *
 * Nothing is sent to the Mac while a gesture might still turn out to be a pinch. Moving the cursor
 * on touchstart defeated the whole point of the delay: the pointer jumped the instant a finger
 * landed, so a two-finger gesture dragged the cursor across the desktop before the second finger
 * was even seen.
 */
function beginPress() {
  if (!gesture || gesture.pressed || gesture.mode !== 'press') return;
  send({ type: 'mouse', action: 'move', ...gesture.at });
  send({ type: 'mouse', action: 'down', button: 'left', clicks: gesture.clicks, ...gesture.at });
  gesture.pressed = true;
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const count = e.touches.length;
  // Noted before the tap can disturb anything, because whether the keyboard was up when the finger
  // landed is what decides if it should still be up when the finger lifts.
  keyboardWasUp = document.activeElement === keyboardSink;

  // Two or more fingers always mean the view, never the Mac. If a press was already in flight,
  // undo it so a pinch cannot leave a button held down or drag something across the desktop.
  if (count >= 2) {
    if (gesture?.pressed) releasePress(normalized(e.touches[0]));
    clearTimeout(gesture?.pressTimer);
    clearTimeout(gesture?.longPressTimer);
    const start = count === 2 ? pinchState(e.touches) : centroid(e.touches);
    gesture = count === 2
      ? { mode: 'view', pinch: start, anchor: start, startX: start.x, startY: start.y, moved: true }
      : { mode: 'scroll', anchor: start };
    return;
  }

  if (gesture) return;  // a multi-finger gesture is still winding down

  // With control off there is nothing for a single finger to send, so it moves the view instead.
  // Demanding two fingers to pan in a read-only view makes the image feel stuck to the screen.
  if (!controlling) {
    const start = centroid(e.touches);
    gesture = { mode: 'view', pinch: null, anchor: start, startX: start.x, startY: start.y, moved: false };
    return;
  }

  const at = normalized(e.touches[0]);
  const now = Date.now();
  const isDoubleTap = now - lastTapAt < DOUBLE_TAP_WINDOW
    && Math.hypot(e.touches[0].clientX - lastTapPoint.x, e.touches[0].clientY - lastTapPoint.y) < 24;

  gesture = {
    mode: 'press',
    at,
    startX: e.touches[0].clientX,
    startY: e.touches[0].clientY,
    moved: false,
    pressed: false,
    clicks: isDoubleTap ? 2 : 1,
  };

  // Everything is deferred so that a pinch, whose second finger lands a moment after the first,
  // never reaches the Mac at all.
  gesture.pressTimer = setTimeout(beginPress, PRESS_DELAY);
  gesture.longPressTimer = setTimeout(() => {
    if (!gesture || gesture.moved) return;
    clearTimeout(gesture.pressTimer);
    releasePress(gesture.at);
    send({ type: 'mouse', action: 'move', ...gesture.at });
    send({ type: 'mouse', action: 'down', button: 'right', clicks: 1, ...gesture.at });
    send({ type: 'mouse', action: 'up', button: 'right', ...gesture.at });
    gesture.mode = 'done';
  }, LONG_PRESS);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (!gesture) return;
  e.preventDefault();

  if (gesture.mode === 'view') {
    // One finger pans, two also zoom. Both are the same drag of the view, so they share a path and
    // a single finger lifting out of a pinch keeps working instead of ending the gesture.
    const multi = e.touches.length >= 2;
    const next = multi ? pinchState(e.touches) : centroid(e.touches);
    if (multi && gesture.pinch) {
      zoomAbout(next.x, next.y, next.distance / gesture.pinch.distance);
    }
    if (Math.hypot(next.x - gesture.startX, next.y - gesture.startY) > TAP_SLOP) gesture.moved = true;
    view.x += next.x - gesture.anchor.x;
    view.y += next.y - gesture.anchor.y;
    applyView();
    gesture.pinch = multi ? next : null;
    gesture.anchor = next;
    return;
  }

  if (gesture.mode === 'scroll' && e.touches.length >= 2) {
    const next = centroid(e.touches);
    // Content follows the fingers, so the wheel delta runs opposite to the movement.
    send({
      type: 'scroll',
      dx: -(next.x - gesture.anchor.x),
      dy: -(next.y - gesture.anchor.y),
      ...normalized(e.touches[0]),
    });
    gesture.anchor = next;
    return;
  }

  if (gesture.mode !== 'press' || e.touches.length !== 1) return;

  const travelled = Math.hypot(e.touches[0].clientX - gesture.startX,
                               e.touches[0].clientY - gesture.startY);
  if (travelled > TAP_SLOP) {
    gesture.moved = true;
    clearTimeout(gesture.longPressTimer);
    // Deliberate movement is a drag, so stop waiting out the pinch grace period.
    clearTimeout(gesture.pressTimer);
    beginPress();
  }
  gesture.at = normalized(e.touches[0]);
  if (gesture.pressed) pendingMove = { type: 'mouse', action: 'move', ...gesture.at };
}, { passive: false });

function endTouch(e) {
  if (!gesture) return;
  e.preventDefault();
  if (e.touches.length > 0) {
    // Fingers remain, so re-anchor on what is still down. Otherwise the centroid shifts the moment
    // one lifts and the view jumps by that distance.
    if (gesture.mode === 'view') {
      const multi = e.touches.length >= 2;
      gesture.pinch = multi ? pinchState(e.touches) : null;
      gesture.anchor = multi ? pinchState(e.touches) : centroid(e.touches);
    }
    return;
  }

  if (gesture.mode === 'press') {
    clearTimeout(gesture.pressTimer);
    clearTimeout(gesture.longPressTimer);
    const at = normalized(e.changedTouches[0]);

    if (gesture.pressed) {
      releasePress(at);
    } else if (!gesture.moved) {
      // Lifted before the press timer fired: a quick tap, which is still a click.
      send({ type: 'mouse', action: 'move', ...at });
      send({ type: 'mouse', action: 'down', button: 'left', clicks: gesture.clicks, ...at });
      send({ type: 'mouse', action: 'up', button: 'left', ...at });
    }

    if (!gesture.moved) {
      lastTapAt = Date.now();
      lastTapPoint = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    }
  } else if (gesture.mode === 'view' && !gesture.moved) {
    countReadOnlyTap();
  }
  gesture = null;

  // Aiming at a field on the Mac means tapping the picture, and that takes focus off the hidden
  // field the keyboard types into — after which the keyboard is still up and nothing it types
  // arrives. So focus is put back, but only if the keyboard was up when this tap started.
  //
  // That condition is the whole point. Dismissing the keyboard blurs the field too, so a flag
  // remembering that the keyboard had once been asked for cannot tell the two apart, and every
  // subsequent tap anywhere on the picture drags the keyboard back up.
  if (keyboardWasUp && document.activeElement !== keyboardSink) {
    resetSink();
    keyboardSink.focus();
    debugLog('refocused the field after a tap on the picture');
  }
}

canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

// ---- soft keyboard ---------------------------------------------------------

// A phone keyboard does not report key presses. Most keys arrive as "Unidentified" with keyCode
// 229, because the IME composes whole words and only settles on the text later — autocorrect,
// suggestions and swipe typing have no keystrokes behind them at all.
//
// So the field's contents are mirrored to the Mac rather than its events: on every change, the new
// value is diffed against what was last sent, and the difference goes out as backspaces followed by
// text. Autocorrect turning "helo" into "hello" is one backspace and "lo", which is exactly what a
// person would have typed, and swipe input arrives as a whole word.
const keyboardSink = document.getElementById('keyboard-sink');

// Backspace against an empty field produces no event whatsoever on Android, so the field is kept
// padded and the caret parked at the end. The user eats padding; we forward a Backspace.
const SINK_PAD = ' '.repeat(32);
const PAD_FLOOR = 8;
let mirrored = '';
let padLeft = 0;
let composing = false;
let topUpTimer = 0;
// Whether the keyboard was up when the current touch began, sampled before the touch can change it.
let keyboardWasUp = false;

function resetSink() {
  keyboardSink.value = SINK_PAD;
  mirrored = SINK_PAD;
  padLeft = SINK_PAD.length;
  try { keyboardSink.setSelectionRange(SINK_PAD.length, SINK_PAD.length); } catch (_) {}
}

function flushSink() {
  const next = keyboardSink.value;
  if (next === mirrored) return;

  // Only what the user typed into a focused field is theirs. A field that changes while it is not
  // focused was changed by the browser, and replaying that as backspaces would eat their document.
  // It is adopted rather than rewritten: rewriting it here forgets a word the IME still has in
  // flight, so the rest of that word diffs against padding and the whole of it is sent a second
  // time — "hello" arriving as "hellhello". Padding is restored on the next pause instead.
  if (document.activeElement !== keyboardSink) {
    mirrored = next;
    padLeft = Math.min(padLeft, next.length);
    return;
  }

  let shared = 0;
  const limit = Math.min(mirrored.length, next.length);
  while (shared < limit && mirrored[shared] === next[shared]) shared++;
  const removed = mirrored.length - shared;
  const added = next.slice(shared);
  mirrored = next;
  padLeft = Math.min(padLeft, shared);

  debugLog(`  -> back x${removed} text ${JSON.stringify(added)} pad=${padLeft}`);
  if (!controlling) { flash('turn on control to type'); return; }
  for (let i = 0; i < removed; i++) {
    send({ type: 'key', action: 'down', code: 'Backspace' });
    send({ type: 'key', action: 'up', code: 'Backspace' });
  }
  if (added) send({ type: 'text', text: added });
}

// Rewriting the field is what breaks phone keyboards: do it while the IME has a word in flight and
// typing stops dead, which is how this failed before. So the field is simply left alone. It is only
// rebuilt once the padding has actually been eaten into, or it has grown absurd, and even then only
// after typing pauses. Ordinary typing never triggers it.
function scheduleTopUp() {
  clearTimeout(topUpTimer);
  if (padLeft >= PAD_FLOOR && keyboardSink.value.length < 4000) return;
  topUpTimer = setTimeout(() => {
    if (composing || document.activeElement !== keyboardSink) return;
    debugLog('  -- refilling the field');
    resetSink();
  }, 400);
}

keyboardSink.addEventListener('compositionstart', () => { composing = true; });
keyboardSink.addEventListener('compositionupdate', () => { composing = true; flushSink(); });
keyboardSink.addEventListener('compositionend', () => {
  composing = false;
  flushSink();
  scheduleTopUp();
});

keyboardSink.addEventListener('input', (e) => {
  // Gboard does not reliably fire compositionstart, so the inputType is the signal that actually
  // tells us a word is still in flight. Trusting the events alone is what rewrote the field mid-word.
  composing = e.inputType === 'insertCompositionText';
  debugLog(`input ${e.inputType} ${JSON.stringify(e.data)} len=${keyboardSink.value.length}`);
  flushSink();
  scheduleTopUp();
});

// Keys that move or act rather than insert. These do come through with a real name, and since they
// leave the field's contents alone the mirror above would never see them.
const SINK_KEYS = new Set([
  'Enter', 'Tab', 'Escape', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
  'Home', 'End', 'PageUp', 'PageDown', 'Delete',
]);

// Diagnostics only. `beforeinput` fires for changes that `input` sometimes does not report, so if
// typing goes missing on a device, the difference between these two lines is where it went.
keyboardSink.addEventListener('beforeinput', (e) => {
  debugLog(`before ${e.inputType} ${JSON.stringify(e.data)}`);
});
keyboardSink.addEventListener('focus', () => debugLog('field focused'));
keyboardSink.addEventListener('blur', () => debugLog('field blurred — typing stops here'));

keyboardSink.addEventListener('keydown', (e) => {
  if (!SINK_KEYS.has(e.key)) {
    debugLog(`keydown ${e.key} (ignored, the field carries it)`);
    return;
  }
  // Enter would otherwise try to submit, and Tab would move focus off the field.
  e.preventDefault();
  if (!controlling) { flash('turn on control to type'); return; }
  send({ type: 'key', action: 'down', code: e.key, ...modifiers(e) });
  send({ type: 'key', action: 'up', code: e.key, ...modifiers(e) });
});

document.getElementById('keyboard').addEventListener('click', () => {
  if (document.activeElement === keyboardSink) {
    keyboardSink.blur();
    return;
  }
  // Typing into a read-only view looks broken, so the button turns control on with the keyboard.
  if (!controlling) setControlling(true);
  resetSink();
  keyboardSink.focus();
  debugLog(`keyboard requested — controlling=${controlling} focused=${document.activeElement === keyboardSink}`);
});

zoomResetBtn.addEventListener('click', resetView);
window.addEventListener('resize', applyView);

// A physical keyboard reports real keys, so it is read directly. The soft keyboard owns its own
// field and is handled above; letting these see those events too would send everything twice, and
// would send nonsense besides, since an IME reports "Unidentified" for the keys it is composing.
window.addEventListener('keydown', (e) => {
  if (!controlling || e.target === keyboardSink) return;
  e.preventDefault();
  const printable = e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey;
  if (printable) {
    // Unicode injection handles any character and any layout without a reverse keycode lookup.
    send({ type: 'text', text: e.key });
  } else {
    send({ type: 'key', action: 'down', code: e.code, ...modifiers(e) });
  }
});

window.addEventListener('keyup', (e) => {
  if (!controlling || e.target === keyboardSink) return;
  e.preventDefault();
  const printable = e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey;
  if (!printable) send({ type: 'key', action: 'up', code: e.code, ...modifiers(e) });
});

controlBtn.addEventListener('click', () => setControlling(!controlling));

document.getElementById('fullscreen').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});

// ---- stats -----------------------------------------------------------------

setInterval(() => {
  const fps = stats.frames;
  const mbps = (stats.bytes * 8) / 1e6;
  const latency = stats.latencyCount ? stats.latencySum / stats.latencyCount : 0;
  document.getElementById('fps').textContent = fps ? `${fps}` : '—';
  document.getElementById('rate').textContent = fps ? `${mbps.toFixed(1)} Mb/s` : '—';
  document.getElementById('lat').textContent = stats.latencyCount ? `${latency.toFixed(0)} ms` : '—';
  stats.frames = 0; stats.bytes = 0; stats.latencySum = 0; stats.latencyCount = 0;
}, 1000);

if (!('VideoDecoder' in window)) {
  // WebCodecs is gated on secure contexts, so a plain http:// LAN address fails here even in a
  // browser that fully supports it. Distinguish the two, or the message sends people hunting for
  // the wrong problem.
  setOverlay(window.isSecureContext
    ? 'this browser has no WebCodecs support — use Chrome, Edge, or Safari 16.4+'
    : 'WebCodecs requires a secure context — reach this page over HTTPS, not a plain http:// address');
} else {
  connect();
}
</script>
</body>
</html>
