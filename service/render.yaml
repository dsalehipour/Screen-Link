databases:
  - name: screenlink-db
    databaseName: screenlink
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: screenlink-certs
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: screenlink-db
          property: connectionString
      # Zone that install hostnames are created under, e.g. screenlink.example
      - key: SCREENLINK_ZONE
        sync: false
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: ACME_CONTACT_EMAIL
        sync: false
      # Generate once with `npm run account-key` and paste it in. Regenerating it orphans the
      # existing ACME account and resets any rate limit exemption attached to it.
      - key: ACME_ACCOUNT_KEY
        sync: false
      # Staging by default. Only move to the production directory once issuance works end to end,
      # because production allows just 50 certificates per registered domain per week.
      - key: ACME_DIRECTORY
        value: https://acme-staging-v02.api.letsencrypt.org/directory
